<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Disk Analyzer · WHM</title>
<style>
:root {
  --bg: #1e1e1e; --panel: #252526; --head: #2b2b2c; --row-alt: #232324; --line: #3a3a3c;
  --text: #e6e6e6; --muted: #a0a0a5; --accent: #0a84ff; --hover: #2f3136; --bar: #1f4a78;
  --warn: #e8a01e; --bad: #e23a3a; --good: #33b833;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "Segoe UI", Ubuntu, Cantarell, system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header svg { width: 40px; height: 40px; }
header h1 { font-size: 17px; margin: 0; }
header small { color: var(--muted); display: block; }
header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.btn { height: 28px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: #3a3a3d; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
main { padding: 16px 18px 28px; display: grid; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card .k { color: var(--muted); }
.card .big { font-size: 24px; font-weight: 600; margin-top: 4px; }
.card .big.warn { color: var(--warn); } .card .big.bad { color: var(--bad); }
.row2 { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1.4fr); gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.panel h2 { font-size: 14px; margin: 0 0 10px; }
.disk { margin-bottom: 10px; }
.disk .t { display: flex; justify-content: space-between; color: var(--muted); }
.disk .t b { color: var(--text); font-weight: 600; }
.meter { height: 9px; background: #3a3a3d; border-radius: 5px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--accent); }
#chart { width: 100%; height: 170px; display: block; }
#chart text { fill: var(--muted); font-size: 11px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.toolbar input[type=search] { flex: 1; min-width: 200px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #2f2f32; padding: 0 10px; }
.toolbar select { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #3a3a3d; padding: 0 6px; }
.scroll { overflow: auto; max-height: 620px; }
table { width: 100%; border-collapse: collapse; min-width: 1050px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
th { position: sticky; top: 0; background: var(--head); font-weight: 500; cursor: pointer; z-index: 1; }
th.sorted { background: #303035; font-weight: 600; }
th.sorted::after { content: " ⌄"; color: var(--muted); } th.sorted.asc::after { content: " ⌃"; }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--hover); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.pct { width: 150px; }
.pct .meter { display: inline-block; width: 80px; vertical-align: middle; margin: 0 6px 0 0; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #3a3a3d; color: var(--muted); }
.tag.susp { background: #4a2a2a; color: #ff9a9a; }
.up { color: var(--warn); } .down { color: var(--good); }
.muted { color: var(--muted); }
form.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; align-items: end; }
form.settings label { display: grid; gap: 4px; color: var(--muted); }
form.settings label.check { display: flex; gap: 8px; align-items: center; color: var(--text); }
form.settings input[type=text] { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #2f2f32; padding: 0 10px; }
#msg { min-height: 18px; }
#msg.err { color: #ff8a8a; } #msg.ok { color: #8ee08e; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2c313c"/><rect x="10" y="10" width="26" height="44" rx="4" fill="#a3e07a"/><rect x="40" y="10" width="14" height="20" rx="4" fill="#7fb6e0"/><rect x="40" y="34" width="14" height="9" rx="3" fill="#b9a0ea"/><rect x="40" y="46" width="14" height="8" rx="3" fill="#efb878"/></svg>
  <div><h1>Advanced Disk Analyzer</h1><small id="sub">Disk and inode usage of every account</small></div>
  <div class="right"><span id="checked"></span><button class="btn" id="refresh">Refresh</button><button class="btn" id="csv">⤓ CSV</button></div>
</header>

<main id="main"><div class="loading">Loading accounts…</div></main>

<template id="tpl">
  <div class="cards" id="cards"></div>
  <div class="row2">
    <section class="panel"><h2>Server disks</h2><div id="disks"></div></section>
    <section class="panel"><h2>Total account usage over time</h2><svg id="chart" viewBox="0 0 600 170" preserveAspectRatio="none"></svg><div class="muted" id="chartnote"></div></section>
  </div>
  <section class="panel">
    <h2>Accounts</h2>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search user, domain, owner or plan" aria-label="Search accounts">
      <select id="filter" aria-label="Filter">
        <option value="all">All accounts</option>
        <option value="80">Over 80% of disk or inodes</option>
        <option value="90">Over 90% of disk or inodes</option>
        <option value="unlimited">Unlimited disk</option>
        <option value="suspended">Suspended</option>
      </select>
      <span class="muted" id="count"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr id="cols"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <section class="panel">
    <h2>Quota alerts</h2>
    <form class="settings" id="settings">
      <label class="check"><input type="checkbox" name="alerts"> Email alerts are on</label>
      <label>Alert at (% of disk or inodes) <input type="text" name="thresholds" placeholder="80, 90"></label>
      <label>Send to <input type="text" name="admin_emails" placeholder=""></label>
      <label class="check"><input type="checkbox" name="notify_owner"> Also email the account owner</label>
      <div><button class="btn primary">Save</button> <button type="button" class="btn" id="checknow">Check now</button></div>
    </form>
    <p class="muted">Checked every hour. Each account is reported once per level; it resets when usage drops below it. <span id="msg"></span></p>
  </section>
</template>

<script>
"use strict";
const TOKEN = /*ADA_TOKEN*/"";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const UNITS = ["B", "KB", "MB", "GB", "TB", "PB"];
function fmt(n) {
  if (n == null) return "";
  const neg = n < 0; n = Math.abs(n);
  let i = 0;
  while (n >= 1024 && i < UNITS.length - 1) { n /= 1024; i++; }
  return (neg ? "−" : "") + (i ? n.toFixed(1) : n) + " " + UNITS[i];
}
const num = (n) => n == null ? "" : n.toLocaleString();
const pctColor = (p) => p >= 90 ? "var(--bad)" : p >= 80 ? "var(--warn)" : "var(--accent)";
function store(k, v) { try { localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }

async function api(action, body) {
  const res = await fetch("?a=" + action, body === undefined ? undefined :
    { method: "POST", headers: { "Content-Type": "application/json", "X-CSRF": TOKEN }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let D = null, sort = JSON.parse(recall("ada-sort") || '{"key":"pct","desc":true}');
const COLS = [
  { key: "user", label: "User" }, { key: "domain", label: "Domain" }, { key: "owner", label: "Owner" }, { key: "plan", label: "Plan" },
  { key: "used", label: "Disk used", n: 1 }, { key: "limit", label: "Limit", n: 1 }, { key: "pct", label: "Disk %" },
  { key: "inodes", label: "Inodes", n: 1 }, { key: "ipct", label: "Inode %" }, { key: "growth", label: "30-day growth", n: 1 },
];

async function load() {
  $("#refresh").disabled = true;
  try {
    D = await api("data");
    if (!$("#cards")) $("#main").replaceChildren($("#tpl").content.cloneNode(true)), wire();
    render();
  } catch (err) {
    $("#main").innerHTML = `<div class="loading">Could not load accounts: ${esc(err.message)}</div>`;
  } finally { $("#refresh").disabled = false; }
}

function render() {
  const a = D.accounts, total = a.reduce((s, x) => s + x.used, 0);
  const over = (t) => a.filter((x) => (x.pct ?? 0) >= t || (x.ipct ?? 0) >= t).length;
  $("#sub").textContent = `${D.host} · version ${D.version}`;
  $("#checked").textContent = D.last_check ? "Alerts checked " + new Date(D.last_check.at * 1000).toLocaleString() : "";
  const card = (k, v, cls = "") => `<div class="card"><div class="k">${k}</div><div class="big ${cls}">${v}</div></div>`;
  $("#cards").innerHTML = card("Accounts", num(a.length)) + card("Used by accounts", fmt(total)) +
    card("Over 90%", num(over(90)), over(90) ? "bad" : "") + card("Over 80%", num(over(80)), over(80) ? "warn" : "") +
    card("Suspended", num(a.filter((x) => x.suspended).length));
  $("#disks").innerHTML = D.disks.map((d) => { const p = d.used / (d.used + d.free) * 100;
    return `<div class="disk"><div class="t"><span><b>${esc(d.mount)}</b> ${esc(d.source)}</span><span>${fmt(d.used)} of ${fmt(d.total)} · <b>${p.toFixed(1)}%</b></span></div>` +
      `<div class="meter"><i style="width:${p}%;background:${pctColor(p)}"></i></div></div>`; }).join("") || '<p class="muted">No disks found.</p>';
  chart();
  const s = D.settings, f = $("#settings");
  f.alerts.checked = s.alerts; f.notify_owner.checked = s.notify_owner;
  f.thresholds.value = s.thresholds.join(", "); f.admin_emails.value = s.admin_emails.join(", ");
  f.admin_emails.placeholder = s.contact + " (server contact)";
  table();
}

function chart() {
  const h = D.history, svg = $("#chart"), W = 600, H = 170, P = 26;
  if (h.length < 2) { svg.innerHTML = ""; $("#chartnote").textContent = "The chart fills in as one snapshot is saved each day."; return; }
  $("#chartnote").textContent = `${h.length} daily snapshots · ${h[0].day} → ${h[h.length - 1].day}`;
  const max = Math.max(...h.map((x) => x.total)) * 1.08 || 1;
  const x = (i) => P + i * (W - P - 4) / (h.length - 1), y = (v) => H - 18 - v / max * (H - 30);
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(" ");
  svg.innerHTML = `<polyline points="${P},${H - 18} ${pts} ${x(h.length - 1)},${H - 18}" fill="rgba(10,132,255,.18)" stroke="none"/>` +
    `<polyline points="${pts}" fill="none" stroke="#0a84ff" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<text x="2" y="12">${fmt(max / 1.08)}</text><text x="${P}" y="${H - 3}">${h[0].day}</text><text x="${W - 70}" y="${H - 3}">${h[h.length - 1].day}</text>`;
}

function table() {
  const q = $("#q").value.trim().toLowerCase(), f = $("#filter").value;
  let rows = D.accounts.filter((a) => (!q || [a.user, a.domain, a.owner, a.plan].some((v) => String(v).toLowerCase().includes(q))) &&
    (f === "all" || (f === "unlimited" ? a.limit == null : f === "suspended" ? a.suspended : Math.max(a.pct ?? 0, a.ipct ?? 0) >= +f)));
  const val = (a, k) => a[k] ?? (typeof a[k] === "string" ? "" : -1);
  rows.sort((a, b) => { const x = val(a, sort.key), y = val(b, sort.key);
    const r = typeof x === "string" ? x.localeCompare(y) : x - y; return sort.desc ? -r : r; });
  $("#cols").innerHTML = COLS.map((c) => `<th data-k="${c.key}" class="${c.n ? "n " : ""}${c.key === sort.key ? "sorted" + (sort.desc ? "" : " asc") : ""}">${c.label}</th>`).join("");
  const bar = (p) => p == null ? '<span class="muted">unlimited</span>' :
    `<span class="meter"><i style="width:${Math.min(100, p)}%;background:${pctColor(p)}"></i></span>${p.toFixed(1)}%`;
  $("#rows").innerHTML = rows.map((a) => `<tr><td><b>${esc(a.user)}</b>${a.suspended ? ' <span class="tag susp">suspended</span>' : ""}</td>` +
    `<td>${esc(a.domain)}</td><td>${esc(a.owner)}</td><td><span class="tag">${esc(a.plan)}</span></td>` +
    `<td class="n">${fmt(a.used)}</td><td class="n">${a.limit == null ? "∞" : fmt(a.limit)}</td><td class="pct">${bar(a.pct)}</td>` +
    `<td class="n">${num(a.inodes)}${a.inode_limit ? ` <span class="muted">/ ${num(a.inode_limit)}</span>` : ""}</td><td class="pct">${a.inodes == null ? "" : bar(a.ipct)}</td>` +
    `<td class="n ${a.growth > 0 ? "up" : a.growth < 0 ? "down" : ""}">${a.growth == null ? '<span class="muted">—</span>' : (a.growth > 0 ? "+" : "") + fmt(a.growth)}</td></tr>`).join("") ||
    '<tr><td colspan="10" class="muted">No accounts match.</td></tr>';
  $("#count").textContent = `${num(rows.length)} of ${num(D.accounts.length)} accounts`;
}

function wire() {
  $("#q").addEventListener("input", table);
  $("#filter").addEventListener("change", table);
  $("#cols").addEventListener("click", (e) => {
    const k = e.target.closest("th")?.dataset.k;
    if (!k) return;
    sort = { key: k, desc: sort.key === k ? !sort.desc : !["user", "domain", "owner", "plan"].includes(k) };
    store("ada-sort", JSON.stringify(sort));
    table();
  });
  const msg = (text, ok) => { const m = $("#msg"); m.textContent = text; m.className = ok ? "ok" : "err"; };
  $("#settings").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      const r = await api("settings", { alerts: f.alerts.checked, notify_owner: f.notify_owner.checked,
        thresholds: f.thresholds.value.split(/[\s,;%]+/).filter(Boolean), admin_emails: f.admin_emails.value });
      D.settings = { ...D.settings, ...r.settings };
      msg("Saved.", true);
    } catch (err) { msg(err.message, false); }
  });
  $("#checknow").addEventListener("click", async () => {
    try {
      const r = await api("check", {});
      msg(r.new ? `${r.new} new alert(s). Emailed: ${r.sent.join(", ") || "nobody (alerts are off)"}` : "No account reached a new level.", true);
      load();
    } catch (err) { msg(err.message, false); }
  });
}

$("#refresh").addEventListener("click", load);
$("#csv").addEventListener("click", () => { location.href = "?a=csv"; });
load();
</script>
</body>
</html>
