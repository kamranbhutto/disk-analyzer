[package]
name = "disk-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process"] }
tower-http = { version = "0.6", features = ["fs"] }
